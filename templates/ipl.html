<!DOCTYPE html>
<html>
<head>
    <title>IPL Match Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 20px;
        }
        h1 {
            color: #ffd700;
        }
        .match-info {
            background-color: #2e2e2e;
            padding: 15px;
            text-align:center;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .team-rcb {
            color: #ff4c4c;
        }
        .team-csk {
            color: #f1c40f;
        }
        .win-bar {
            display: flex;
            height: 30px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }
        .rcb-bar {
            width: 62%;
            background-color: #ff4c4c;
            text-align: right;
            padding-right: 10px;
            line-height: 30px;
            color: #000;
        }
        .csk-bar {
            width: 38%;
            background-color: #f1c40f;
            text-align: left;
            padding-left: 10px;
            line-height: 30px;
            color: #000;
        }
    </style>
</head>
<body>
    <h1>IPL Match Information</h1>

    <div class="match-info">
        <p><strong>Match:</strong> <span class="team-rcb">RCB</span> vs <span class="team-csk">CSK</span></p>
        <p>Today, 7:30 PM</p>
        <p> T20 52 of 74</p>
    </div>

    <h2>Win Probability</h2>
    <div class="win-bar">
        <div class="rcb-bar">RCB: 62%</div>
        <div class="csk-bar">CSK: 38%</div>
    </div>
</body>
</html>
